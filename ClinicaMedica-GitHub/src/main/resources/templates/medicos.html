<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Médicos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header><h1>Médicos</h1></header>
<nav><a th:href="@{/}">Início</a><a th:href="@{/pacientes}">Pacientes</a><a th:href="@{/medicos}">Médicos</a><a th:href="@{/consultas}">Consultas</a></nav>
<main>
    <table>
        <thead><tr><th>ID</th><th>Nome</th><th>Especialidade</th><th>CRM</th></tr></thead>
        <tbody>
        <tr th:each="medico : ${medicos}">
            <td th:text="${medico.id}">1</td>
            <td th:text="${medico.nome}">Nome</td>
            <td th:text="${medico.especialidade}">Especialidade</td>
            <td th:text="${medico.crm}">CRM</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
