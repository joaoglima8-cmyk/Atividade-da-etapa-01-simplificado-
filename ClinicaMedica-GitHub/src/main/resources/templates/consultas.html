<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header><h1>Consultas</h1></header>
<nav><a th:href="@{/}">Início</a><a th:href="@{/pacientes}">Pacientes</a><a th:href="@{/medicos}">Médicos</a><a th:href="@{/consultas}">Consultas</a></nav>
<main>
    <table>
        <thead><tr><th>ID</th><th>Data/Hora</th><th>Paciente</th><th>Médico</th><th>Status</th><th>Observações</th></tr></thead>
        <tbody>
        <tr th:each="consulta : ${consultas}">
            <td th:text="${consulta.id}">1</td>
            <td th:text="${#temporals.format(consulta.dataHora, 'dd/MM/yyyy HH:mm')}">24/09/2026 09:00</td>
            <td th:text="${consulta.paciente.nome}">Paciente</td>
            <td th:text="${consulta.medico.nome}">Médico</td>
            <td th:text="${consulta.status}">AGENDADA</td>
            <td th:text="${consulta.observacoes}">Observação</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
